<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Inline plane favicon (signal orange), so the tab reads as the flight
         recorder instead of the browser's default globe. Data URI, not a
         committed .ico, to stay consistent with the no-external-asset ethos. -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Cpath%20fill='%23ff6b35'%20d='M16%202%20L19%2013%20L30%2020%20L30%2022%20L18%2018%20L18%2025%20L22%2028%20L22%2029%20L16%2027%20L10%2029%20L10%2028%20L14%2025%20L14%2018%20L2%2022%20L2%2020%20L13%2013%20Z'/%3E%3C/svg%3E"
    />
    <title>Replay</title>
    <meta
      name="description"
      content="A flight recorder for AI agents. Record every tool call, token, retry, and cost, then scrub through the run on a timeline."
    />
    <!-- Social preview so a shared link renders a title card instead of a bare
         URL. No og:url or og:image: the URL is deployment-specific and there is
         no hosted preview image yet, and crawlers fall back to the fetched URL. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Replay - flight recorder for AI agents" />
    <meta
      property="og:description"
      content="Record every tool call, token, retry, and cost, then scrub through an agent run on a timeline."
    />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Replay - flight recorder for AI agents" />
    <meta
      name="twitter:description"
      content="Record every tool call, token, retry, and cost, then scrub through an agent run on a timeline."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
